name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Pack
        run: npm pack
      - name: Publish release with the tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          NOTES="$(git tag -l --format='%(contents)' "$TAG" | head -60)"
          if [ -z "$NOTES" ]; then NOTES="Release $TAG"; fi
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" || true
          gh release upload "$TAG" ./*.tgz --clobber
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/$(ls ./*.tgz | head -1)"
